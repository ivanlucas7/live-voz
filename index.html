<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="description" content="Converse por voz em tempo real, em português, com um assistente de rosto animado." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Live Voz</title>
  </head>
  <body data-state="idle">
    <main class="app">
      <header class="topbar">
        <span class="brand">Live Voz</span>
        <span id="status" class="status" aria-live="polite">Toque no microfone para conversar</span>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Configurações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
        </button>
      </header>

      <section class="stage">
        <div class="bezel">
          <canvas id="face" aria-label="Rosto do assistente"></canvas>
          <div class="pixels" aria-hidden="true"></div>
        </div>
        <div id="toolChip" class="chip" hidden></div>
      </section>

      <aside id="transcript" class="transcript" aria-label="Transcrição da conversa">
        <div class="transcript-head">
          <h2>Conversa</h2>
          <button id="closeTranscript" class="icon-btn" type="button" aria-label="Fechar transcrição">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <ol id="messages" class="messages">
          <li class="empty">O que for dito aparece aqui.</li>
        </ol>
        <form id="textForm" class="text-form" autocomplete="off">
          <input id="textInput" type="text" placeholder="Ou digite uma mensagem…" disabled />
          <button type="submit" disabled>Enviar</button>
        </form>
      </aside>

      <footer class="controls">
        <button id="transcriptBtn" class="round" type="button" aria-label="Mostrar transcrição" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" /></svg>
        </button>
        <button id="talkBtn" class="talk" type="button" aria-label="Começar conversa" aria-pressed="false">
          <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
        </button>
        <button id="muteBtn" class="round" type="button" aria-label="Silenciar microfone" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18" /></svg>
        </button>
      </footer>
    </main>

    <dialog id="settings" class="settings">
      <form method="dialog" id="settingsForm">
        <h2>Configurações</h2>
        <label>
          Nome da assistente
          <input name="name" type="text" maxlength="30" />
        </label>
        <label>
          Voz
          <select name="voice"></select>
        </label>
        <label>
          Instruções extras <small>(opcional)</small>
          <textarea name="extraInstructions" rows="3" maxlength="600" placeholder="Ex.: me chame de Ivan e fale de forma bem descontraída."></textarea>
        </label>
        <label id="passwordField" hidden>
          Senha do app
          <input name="password" type="password" autocomplete="current-password" />
        </label>
        <p class="hint">As mudanças valem na próxima conversa.</p>
        <div class="actions">
          <button value="cancel" type="submit" class="ghost">Cancelar</button>
          <button value="save" type="submit" class="primary">Salvar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
